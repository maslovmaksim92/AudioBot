# /etc/nginx/sites-available/ai.vd40.ru
# After placing this file:
#   sudo ln -s /etc/nginx/sites-available/ai.vd40.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ai.vd40.ru

server {
    listen 80;
    server_name ai.vd40.ru;

    # Allow certbot HTTP-01 challenges; redirect everything else to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai.vd40.ru;

    # SSL certs — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/ai.vd40.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.vd40.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # API → uvicorn on localhost
    location /api/ {
        proxy_pass         http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support (for AI realtime streaming)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend static build
    root /var/www/audiobot/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
